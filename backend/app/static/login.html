<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen — Nieuwsbrief Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF7200'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='17' font-weight='800' fill='white'%3ED%3C/text%3E%3C/svg%3E">
<style>
  :root { --accent: #ff7200; --accent-hover: #ea6700; --ring: rgba(255,114,0,.22); --text: #18181b; --muted: #71717a; --faint: #a1a1aa; --border: #e4e4e7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
         font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         -webkit-font-smoothing: antialiased; background: #0c0d10; color: var(--text); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
         background: radial-gradient(800px 420px at 12% -8%, rgba(255,114,0,.20), transparent 60%),
                     radial-gradient(700px 400px at 100% 110%, rgba(255,138,42,.10), transparent 60%); }
  .card { position: relative; width: 100%; max-width: 400px; padding: 36px 32px 28px; border-radius: 20px; background: #fff;
          box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04); animation: in .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
  .brand .logo { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(140deg, #ff8a2a, #ff7200 55%, #e85d00); color: #fff; font-size: 20px; font-weight: 800;
          box-shadow: 0 6px 18px rgba(255,114,0,.35), inset 0 1px 0 rgba(255,255,255,.25); }
  .brand .name { font-size: 16px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
  .brand .name small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  p.sub { margin: 14px 0 24px; text-align: center; color: var(--muted); font-size: 14px; }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #3f3f46; }
  input { width: 100%; margin-bottom: 16px; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px;
          font-size: 14.5px; font-family: inherit; color: var(--text); box-shadow: 0 1px 2px rgba(16,24,40,.04);
          transition: border-color .15s, box-shadow .15s; }
  input:hover { border-color: #d4d4d8; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .veldhint { margin: -10px 0 16px; font-size: 12px; color: var(--faint); }
  button { width: 100%; margin-top: 4px; padding: 12px; border: none; border-radius: 10px; background: #18181b; color: #fff;
           font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s, transform .12s; }
  button:hover { background: #000; }
  button:active { transform: scale(.99); }
  button:disabled { opacity: .55; cursor: default; }
  .error, .info { display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.45; }
  .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .info { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .foot { margin: 22px 0 0; text-align: center; font-size: 12px; color: var(--faint); }
  .forgot { display: block; width: auto; margin: 14px auto 0; padding: 0; border: none; background: none; color: var(--muted);
            font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .forgot:hover { background: none; color: var(--accent); }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <div class="brand">
      <div class="logo">D</div>
      <div class="name">Nieuwsbrief Studio<small>door Dunion</small></div>
    </div>
    <p class="sub">Log in om verder te gaan</p>
    <div class="error" id="error">Onjuiste inloggegevens, probeer opnieuw.</div>
    <div class="info" id="info"></div>
    <label for="username">Gebruiker</label>
    <input id="username" name="username" type="text" autocomplete="username" value="dunion" required>
    <p class="veldhint">Klant? Vul je e-mailadres in (of je bedrijfscode).</p>
    <label for="password">Wachtwoord</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="submitBtn">Inloggen</button>
    <button type="button" class="forgot" id="forgotBtn">Wachtwoord vergeten?</button>
    <p class="foot">Beveiligde omgeving van Dunion Online Marketing</p>
  </form>
<script>
  const errorBox = document.getElementById("error");
  const infoBox = document.getElementById("info");
  function showError(msg) {
    infoBox.style.display = "none";
    errorBox.textContent = msg;
    errorBox.style.display = "block";
  }
  function showInfo(msg) {
    errorBox.style.display = "none";
    infoBox.textContent = msg;
    infoBox.style.display = "block";
  }

  const err = new URLSearchParams(location.search).get("error");
  if (err === "2") showError("Te veel pogingen. Wacht een paar minuten en probeer opnieuw.");
  else if (err) showError("Onjuiste inloggegevens, probeer opnieuw.");
  if (new URLSearchParams(location.search).get("reset") === "1") {
    showInfo("Je wachtwoord is ingesteld. Log in met je e-mailadres.");
  }

  let authConfig = null;
  async function getAuthConfig() {
    if (authConfig) return authConfig;
    authConfig = await (await fetch("/auth/config")).json();
    return authConfig;
  }

  // E-mailadres als gebruikersnaam = Supabase-login; anders de klassieke POST /login.
  document.querySelector("form.card").addEventListener("submit", async (e) => {
    const username = document.getElementById("username").value.trim();
    if (!username.includes("@")) return; // klassieke flow: formulier post gewoon door
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    try {
      const cfg = await getAuthConfig();
      if (!cfg.supabase_url || !cfg.publishable_key) {
        showError("Inloggen met e-mail is nog niet ingeschakeld. Gebruik je bedrijfscode, of neem contact op met Dunion.");
        return;
      }
      const tokenRes = await fetch(`${cfg.supabase_url}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": cfg.publishable_key },
        body: JSON.stringify({ email: username, password: document.getElementById("password").value }),
      });
      if (!tokenRes.ok) {
        showError("Onjuiste inloggegevens, probeer opnieuw.");
        return;
      }
      const { access_token } = await tokenRes.json();
      const sessionRes = await fetch("/login/supabase", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ access_token }),
      });
      if (!sessionRes.ok) {
        const body = await sessionRes.json().catch(() => ({}));
        showError(body.detail || "Inloggen mislukt, probeer het opnieuw.");
        return;
      }
      location.href = "/";
    } catch (netErr) {
      showError("Netwerkfout: " + netErr.message);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("forgotBtn").addEventListener("click", async () => {
    const email = document.getElementById("username").value.trim();
    if (!email.includes("@")) {
      showError("Vul eerst je e-mailadres in bij Gebruiker, en klik dan op 'Wachtwoord vergeten?'. Log je in met een bedrijfscode? Vraag Dunion dan om een nieuw wachtwoord.");
      return;
    }
    try {
      const cfg = await getAuthConfig();
      if (!cfg.supabase_url || !cfg.publishable_key) {
        showError("Wachtwoord-reset is nog niet ingeschakeld. Neem contact op met Dunion.");
        return;
      }
      const redirect = encodeURIComponent(location.origin + "/welkom");
      await fetch(`${cfg.supabase_url}/auth/v1/recover?redirect_to=${redirect}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": cfg.publishable_key },
        body: JSON.stringify({ email }),
      });
      showInfo("Als dit e-mailadres bij ons bekend is, ontvang je binnen enkele minuten een e-mail om een nieuw wachtwoord in te stellen.");
    } catch (netErr) {
      showError("Netwerkfout: " + netErr.message);
    }
  });
</script>
</body>
</html>
